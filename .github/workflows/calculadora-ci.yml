name: Calculadora CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar el JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar y ejecutar tests de la Calculadora
        run: mvn clean package  

      - name: Guardar la Calculadora compilada
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-app
          path: target/*.jar